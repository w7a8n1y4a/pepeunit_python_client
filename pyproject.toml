[build-system]
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "pepeunit-client"
dynamic = ["version"]
authors = [
  { name="Ivan Serebrennikov", email="admin@silberworks.com" },
]
description = "Client Framework for Pepeunit"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Internet :: WWW/HTTP",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "psutil>=5.8.0; platform_system != 'emscripten'",
    "cryptography>=44.0.0",
    "httpx>=0.24.0",
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://pepeunit.com/"
Issues = "https://github.com/w7a8n1y4a/pepeunit_python_client/issues"
Repository = "https://github.com/w7a8n1y4a/pepeunit_python_client"
Documentation = "https://github.com/w7a8n1y4a/pepeunit_python_client#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/pepeunit_client"]

[tool.hatch.version]
path = "src/pepeunit_client/__init__.py"
